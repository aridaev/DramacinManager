default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: localhost
  username: dracin_manager
  password: <%= ENV.fetch("DRACIN_MANAGER_DATABASE_PASSWORD") { File.read("/root/.dracin_db_pass").strip } %>

development:
  <<: *default
  database: dracin_manager_development

test:
  <<: *default
  database: dracin_manager_test

production:
  primary: &primary_production
    <<: *default
    database: dracin_manager_production
  cache:
    <<: *primary_production
    database: dracin_manager_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: dracin_manager_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: dracin_manager_production_cable
    migrations_paths: db/cable_migrate
