production:
  auto_post_scheduler:
    class: AutoPostSchedulerJob
    queue: default
    schedule: every minute
  provider_recovery_check:
    class: ProviderRecoveryCheckJob
    queue: default
    schedule: every 5 minutes
  purge_provider_error_stats:
    command: "ProviderErrorStat.purge_old!"
    schedule: every day at 4:30am
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  purge_old_visits:
    command: "Visit.where('created_at < ?', Visit::RETENTION.ago).in_batches(of: 5000).delete_all"
    schedule: every day at 4am
